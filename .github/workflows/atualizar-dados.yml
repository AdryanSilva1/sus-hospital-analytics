name: Atualizar dados

on:
  schedule:
    - cron: "0 12 15 * *"   # dia 15 de cada mês, 9h de Brasília
  workflow_dispatch:         # botão para rodar na mão
    inputs:
      ano_inicial:
        description: "Primeiro ano a buscar"
        default: "2019"

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - run: pytest -q

  # Os estados rodam em grupos ao mesmo tempo. Cada estado grava só os
  # próprios arquivos (ex.: por_municipio/SP.parquet), então os grupos
  # não brigam entre si na hora de salvar.
  atualizar:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        estados:
          - "SP"
          - "MG"
          - "RJ ES"
          - "BA SE AL"
          - "PE PB RN CE"
          - "MA PI PA AP AM RR AC RO TO"
          - "PR SC RS"
          - "GO DF MT MS"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-pipeline.txt

      # As tabelas do IBGE ficam salvas no repositório (a API do IBGE não
      # responde fora do Brasil), por isso aqui só entram os dados do DATASUS.
      - name: Rodar pipeline (${{ matrix.estados }})
        run: python -m pipeline.run --sem-apoio --uf ${{ matrix.estados }} --ano-inicial ${{ inputs.ano_inicial || '2019' }}

      - name: Salvar dados novos
        run: |
          git config user.name "AdryanSilva1"
          git config user.email "152924015+AdryanSilva1@users.noreply.github.com"
          git add data/processados
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "dados: ${{ matrix.estados }} ($(date +%Y-%m))"
          # Outros grupos podem ter salvo antes: atualiza e tenta de novo
          for tentativa in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((tentativa * 15))
          done
          exit 1

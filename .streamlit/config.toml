[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "6px"
showWidgetBorder = true

# Claro e escuro em branco e cinzas; a cor fica nos dados (azul, igual aos gráficos).
[theme.light]
primaryColor = "#3A86C4"
backgroundColor = "#F4F4F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18181B"
borderColor = "#E4E4E7"

[theme.dark]
primaryColor = "#5DA9E9"
backgroundColor = "#0B0B0C"
secondaryBackgroundColor = "#1C1C1F"
textColor = "#F4F4F5"
borderColor = "#2E2E33"

[client]
toolbarMode = "viewer"   # esconde o botão Deploy e o menu de desenvolvedor

[server]
headless = true
